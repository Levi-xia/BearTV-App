name: Build & Release APK

# 推送 v 开头的 tag（如 v0.1.0）时自动按架构分包并发布 Release。
on:
  push:
    tags: ["v*"]

# 同一个 tag 重复触发时，取消尚未跑完的旧构建，避免浪费 runner。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# softprops/action-gh-release 创建 Release / 上传产物需要写权限。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Guard: secrets must never be committed. CI intentionally builds with the
      # empty defaults from secrets.example.json, so published APKs stay clean.
      - name: Guard against committed secrets
        run: |
          if git ls-files --error-unmatch secrets.json >/dev/null 2>&1; then
            echo "::error::secrets.json is tracked by git — remove it before building."
            exit 1
          fi
          echo "OK: no secrets.json in the repository"

      # Release 签名：从 GitHub Secrets 解出固定 keystore 写入 key.properties。
      # 没有它时构建会失败——缺省 debug keystore 是每个 runner 随机生成的，
      # 用它签的 APK 无法覆盖安装（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.BEAR_TV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BEAR_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BEAR_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BEAR_TV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing BEAR_TV_KEYSTORE_B64 secret — releases must be signed with the fixed key to be updatable."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/bear_tv_release.jks
          echo "storeFile=app/bear_tv_release.jks" > android/key.properties
          echo "storePassword=$STORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "OK: release signing key restored"

      # --split-per-abi：分别产出 armeabi-v7a / arm64-v8a / x86_64 三个 APK，
      # 而不是一个包含全部 ABI 的巨包。签名用上面的固定 release key。
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      # 从 pubspec.yaml 读构建号（version: 0.1.0+1 -> 0.1.0+1），仅用于展示。
      - name: Resolve version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' ')
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 直接复用刚推送的 tag（github.ref_name，如 v0.1.0）作为 Release。
          tag_name: ${{ github.ref_name }}
          name: 熊熊TV ${{ github.ref_name }}
          body: |
            Tag: ${{ github.ref_name }} ｜ pubspec: ${{ steps.ver.outputs.full }}
            提交: ${{ github.sha }}
            按架构分包，按需下载：
            - `arm64-v8a`：绝大多数现代电视盒子 / 手机（首选）
            - `armeabi-v7a`：较老的 32 位设备
            - `x86_64`：模拟器 / x86 设备
          files: build/app/outputs/flutter-apk/*-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
