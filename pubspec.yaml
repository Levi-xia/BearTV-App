name: bear_tv
description: "熊熊TV (Bear TV) · Android TV player UI shell (Flutter). Focus/remote navigation + animated UI; data & player wired behind interfaces."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  video_player: ^2.9.2
  # Cross-platform persistence: shared_preferences for scalar config
  # (apiKey / selected sources / custom sources), Hive for structured playback
  # records (progress, per-title speed, skip intro/outro). Both map to the
  # native store per platform (SharedPreferences / IndexedDB / file) and stay
  # light on low-end Android TV memory.
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fvp: ^0.39.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/pinyin_dict.txt
    - assets/images/splash_bg.jpg
